# Optional browser tests of the static export (all 51 activities, desktop + mobile).
# Run manually from the Actions tab; it does not block deployment.
name: Browser tests (static export)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Build static export with test hook and run tests
        run: npm run test:static
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
